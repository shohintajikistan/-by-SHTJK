<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ff7a00">
<meta name="description" content="Курс валют банков Таджикистана — SHOHIN">
<meta name="application-name" content="SHOHIN Currency">

<link rel="manifest" href="./manifest.json">

<title>SHOHIN Currency — Курс валют</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --orange:#ff7a00;
    --orange2:#ff9d2e;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#758096;
    --green:#12a86b;
    --red:#e53935;
    --border:#e9edf4;
    --shadow:0 8px 30px rgba(20,30,50,.07);
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#ff6a00,#ff9d2e);
    color:white;
    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        25px;
    border-radius:0 0 28px 28px;
    box-shadow:0 8px 25px rgba(255,122,0,.25);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    backdrop-filter:blur(10px);
}

.logo-text{
    font-weight:800;
    font-size:19px;
}

.logo-sub{
    font-size:12px;
    opacity:.85;
    margin-top:2px;
}

.refresh-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:21px;
    transition:.2s;
}

.refresh-btn:active{
    transform:scale(.9);
}

.header-title{
    margin-top:25px;
}

.header-title h1{
    font-size:27px;
    line-height:1.15;
    font-weight:800;
}

.header-title p{
    margin-top:8px;
    font-size:14px;
    opacity:.88;
}

/* STATUS */

.status{
    margin:16px;
    background:white;
    border-radius:16px;
    padding:13px 15px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    flex:none;
}

.status.loading .status-dot{
    background:#f5a623;
    animation:pulse 1s infinite;
}

.status.error .status-dot{
    background:var(--red);
}

@keyframes pulse{
    50%{opacity:.3}
}

/* CONTENT */

.container{
    max-width:1000px;
    margin:auto;
    padding:0 16px 40px;
}

/* OFFICIAL */

.section-title{
    font-size:19px;
    font-weight:800;
    margin:22px 0 13px;
}

.official-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.currency-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
}

.currency-card::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,122,0,.06);
    right:-25px;
    top:-25px;
}

.currency-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.currency-name{
    display:flex;
    align-items:center;
    gap:8px;
}

.flag{
    font-size:25px;
}

.code{
    font-size:16px;
    font-weight:800;
}

.currency-label{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

.currency-value{
    margin-top:13px;
    font-size:24px;
    font-weight:900;
    color:var(--text);
}

.currency-unit{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

/* CONTROLS */

.controls{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:200px;
    height:48px;
    border:1px solid var(--border);
    background:white;
    border-radius:15px;
    padding:0 16px;
    outline:none;
    box-shadow:var(--shadow);
}

.search:focus{
    border-color:var(--orange);
}

.currency-select{
    height:48px;
    border:1px solid var(--border);
    background:white;
    border-radius:15px;
    padding:0 14px;
    outline:none;
    box-shadow:var(--shadow);
    font-weight:700;
}

/* BANK CARD */

.bank-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.bank-card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:17px;
    box-shadow:var(--shadow);
}

.bank-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.bank-name{
    font-size:16px;
    font-weight:800;
    line-height:1.25;
}

.bank-official{
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
}

.badge{
    background:#e8faf3;
    color:var(--green);
    border-radius:20px;
    padding:6px 9px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.badge.no-data{
    background:#fff0ef;
    color:var(--red);
}

.rate-box{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.rate{
    background:#f7f9fc;
    border-radius:14px;
    padding:13px;
}

.rate-label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:5px;
}

.rate-value{
    font-size:21px;
    font-weight:900;
}

.rate-value.buy{
    color:var(--green);
}

.rate-value.sell{
    color:var(--orange);
}

.bank-date{
    margin-top:12px;
    color:var(--muted);
    font-size:11px;
}

.no-bank-data{
    margin-top:14px;
    background:#fff7f5;
    color:#9a4b43;
    padding:12px;
    border-radius:12px;
    font-size:12px;
}

/* EMPTY */

.empty{
    text-align:center;
    background:white;
    padding:35px 20px;
    border-radius:20px;
    color:var(--muted);
    box-shadow:var(--shadow);
}

/* FOOTER */

.footer{
    text-align:center;
    padding:25px 15px 40px;
    color:var(--muted);
    font-size:11px;
}

.footer strong{
    color:var(--orange);
}

/* LOADER */

.loader{
    width:22px;
    height:22px;
    border:3px solid #eee;
    border-top-color:var(--orange);
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:500px){
    .official-grid{
        grid-template-columns:1fr 1fr;
    }

    .currency-value{
        font-size:21px;
    }

    .currency-select{
        width:100%;
    }
}

@media(min-width:700px){
    .official-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .bank-list{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-top">

        <div class="logo">

            <div class="logo-icon">💱</div>

            <div>
                <div class="logo-text">SHOHIN</div>
                <div class="logo-sub">Currency • Tajikistan</div>
            </div>

        </div>

        <button class="refresh-btn"
                id="refreshBtn"
                aria-label="Обновить">
            ↻
        </button>

    </div>

    <div class="header-title">
        <h1>Курс валют</h1>
        <p>Курсы банков Таджикистана</p>
    </div>

</header>


<div id="status" class="status loading">

    <div class="loader" id="statusLoader"></div>

    <div id="statusText">
        Загружаем актуальные курсы...
    </div>

</div>


<main class="container">

    <!-- OFFICIAL -->

    <div class="section-title">
        🇹🇯 Официальный курс НБТ
    </div>

    <div id="officialGrid" class="official-grid">

        <div class="currency-card">
            <div class="loader"></div>
        </div>

        <div class="currency-card">
            <div class="loader"></div>
        </div>

        <div class="currency-card">
            <div class="loader"></div>
        </div>

        <div class="currency-card">
            <div class="loader"></div>
        </div>

    </div>


    <!-- BANKS -->

    <div class="section-title">
        🏦 Курсы банков
    </div>

    <div class="controls">

        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="🔎 Поиск банка..."
            autocomplete="off"
        >

        <select id="currencySelect" class="currency-select">

            <option value="USD">🇺🇸 USD — Доллар</option>
            <option value="EUR">🇪🇺 EUR — Евро</option>
            <option value="RUB">🇷🇺 RUB — Рубль</option>
            <option value="CNY">🇨🇳 CNY — Юань</option>

        </select>

    </div>


    <div id="bankList" class="bank-list">

        <div class="empty">
            <div class="loader" style="margin:auto"></div>
            <p style="margin-top:12px">
                Загружаем банки...
            </p>
        </div>

    </div>

</main>


<footer class="footer">

    <div>
        Источник: <strong>Национальный банк Таджикистана</strong>
    </div>

    <div id="updatedText" style="margin-top:5px">
        Данные загружаются...
    </div>

    <div style="margin-top:10px">
        SHOHIN Currency © 2026
    </div>

</footer>


<script>

/* =========================================================
   SHOHIN CURRENCY
   РАБОТАЕТ С ТВОИМ rates.json
========================================================= */

const DATA_URL = "./rates.json";

let ratesData = null;

const CURRENCIES = {

    USD:{
        flag:"🇺🇸",
        name:"Доллар США"
    },

    EUR:{
        flag:"🇪🇺",
        name:"Евро"
    },

    RUB:{
        flag:"🇷🇺",
        name:"Российский рубль"
    },

    CNY:{
        flag:"🇨🇳",
        name:"Китайский юань"
    }

};


/* DOM */

const officialGrid =
    document.getElementById("officialGrid");

const bankList =
    document.getElementById("bankList");

const searchInput =
    document.getElementById("searchInput");

const currencySelect =
    document.getElementById("currencySelect");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const statusLoader =
    document.getElementById("statusLoader");

const refreshBtn =
    document.getElementById("refreshBtn");

const updatedText =
    document.getElementById("updatedText");


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatRate(value){

    if(value === null ||
       value === undefined ||
       value === "" ||
       Number.isNaN(Number(value))){

        return "—";
    }

    return Number(value).toLocaleString(
        "ru-RU",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:4
        }
    );
}


/* =========================================================
   OFFICIAL
========================================================= */

function renderOfficial(){

    if(!ratesData ||
       !ratesData.official){

        officialGrid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                Официальные курсы не найдены
            </div>
        `;

        return;
    }


    officialGrid.innerHTML =
        Object.keys(CURRENCIES)
        .map(code => {

            const currency =
                CURRENCIES[code];

            const value =
                ratesData.official[code];

            return `

                <div class="currency-card">

                    <div class="currency-top">

                        <div class="currency-name">

                            <span class="flag">
                                ${currency.flag}
                            </span>

                            <div>

                                <div class="code">
                                    ${code}
                                </div>

                                <div class="currency-label">
                                    ${currency.name}
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="currency-value">
                        ${formatRate(value)}
                    </div>

                    <div class="currency-unit">
                        сомони за 1 ${code}
                    </div>

                </div>

            `;

        })
        .join("");
}


/* =========================================================
   BANKS
========================================================= */

function renderBanks(){

    if(!ratesData ||
       !Array.isArray(ratesData.banks)){

        bankList.innerHTML = `
            <div class="empty">
                Данные банков не найдены
            </div>
        `;

        return;
    }


    const currency =
        currencySelect.value;

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const banks =
        ratesData.banks.filter(bank => {

            const name =
                String(bank.bank || "")
                    .toLowerCase();

            return name.includes(search);

        });


    if(banks.length === 0){

        bankList.innerHTML = `
            <div class="empty">
                🔎 Банк не найден
            </div>
        `;

        return;
    }


    bankList.innerHTML =
        banks.map(bank => {

            const available =
                bank.available === true;


            /*
             * ВАЖНО:
             * Берём именно cash.buy / cash.sell
             * из твоего JSON
             */

            const cash =
                bank.cash || {};


            const buy =
                cash.buy;


            const sell =
                cash.sell;


            return `

                <article class="bank-card">

                    <div class="bank-head">

                        <div>

                            <div class="bank-name">
                                ${escapeHtml(bank.bank)}
                            </div>

                            ${
                                bank.official_name
                                ?
                                `
                                <div class="bank-official">
                                    ${escapeHtml(bank.official_name)}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                        ${
                            available
                            ?
                            `
                            <div class="badge">
                                Данные есть
                            </div>
                            `
                            :
                            `
                            <div class="badge no-data">
                                Нет данных
                            </div>
                            `
                        }

                    </div>


                    ${
                        available
                        ?
                        `

                        <div class="rate-box">

                            <div class="rate">

                                <div class="rate-label">
                                    🟢 Покупка ${currency}
                                </div>

                                <div class="rate-value buy">
                                    ${formatRate(buy)}
                                </div>

                                <div class="currency-label">
                                    сомони
                                </div>

                            </div>


                            <div class="rate">

                                <div class="rate-label">
                                    🟠 Продажа ${currency}
                                </div>

                                <div class="rate-value sell">
                                    ${formatRate(sell)}
                                </div>

                                <div class="currency-label">
                                    сомони
                                </div>

                            </div>

                        </div>

                        `
                        :
                        `

                        <div class="no-bank-data">
                            Курсы этого банка сейчас
                            отсутствуют в источнике НБТ.
                        </div>

                        `
                    }


                    ${
                        bank.date
                        ?
                        `
                        <div class="bank-date">
                            🕐 Обновлено: ${escapeHtml(bank.date)}
                        </div>
                        `
                        :
                        ""
                    }

                </article>

            `;

        })
        .join("");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   DATE
========================================================= */

function formatUpdatedDate(value){

    if(!value){
        return "Дата обновления неизвестна";
    }

    try{

        const date =
            new Date(value);

        if(Number.isNaN(date.getTime())){
            return value;
        }

        return date.toLocaleString(
            "ru-RU",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return value;

    }
}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadRates(){

    setLoading(true);

    try{

        /*
         * cache-busting:
         * браузер/PWA не будет бесконечно
         * показывать старый rates.json
         */

        const url =
            DATA_URL +
            "?v=" +
            Date.now();


        const response =
            await fetch(url,{
                cache:"no-store"
            });


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Проверяем структуру
         */

        if(!data ||
           typeof data !== "object"){

            throw new Error(
                "Неверный JSON"
            );

        }


        ratesData = data;


        renderOfficial();
        renderBanks();


        /*
         * Статистика
         */

        const found =
            data.statistics?.found ?? "—";

        const requested =
            data.statistics?.requested ?? "—";


        status.className =
            "status";

        statusLoader.outerHTML =
            '<div class="status-dot" id="statusLoader"></div>';


        statusText.textContent =
            `Курсы загружены • ${found} из ${requested} банков`;


        updatedText.textContent =
            "Обновлено: " +
            formatUpdatedDate(data.updated);


    }catch(error){

        console.error(
            "Ошибка загрузки rates.json:",
            error
        );


        status.className =
            "status error";


        status.innerHTML = `
            <div class="status-dot"></div>
            <div>
                Не удалось загрузить курсы
            </div>
        `;


        officialGrid.innerHTML = `
            <div class="empty"
                 style="grid-column:1/-1">

                ❌ Не удалось загрузить
                <b>rates.json</b>

                <div style="
                    margin-top:10px;
                    font-size:12px;
                ">
                    Проверь, что rates.json
                    находится рядом с index.html.
                </div>

            </div>
        `;


        bankList.innerHTML = `
            <div class="empty">

                ❌ Ошибка загрузки данных

                <div style="
                    margin-top:10px;
                    font-size:12px;
                ">
                    ${escapeHtml(error.message)}
                </div>

            </div>
        `;


        updatedText.textContent =
            "Ошибка загрузки данных";

    }

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(value){

    if(value){

        status.className =
            "status loading";

        status.innerHTML = `
            <div class="loader"></div>
            <div>
                Загружаем актуальные курсы...
            </div>
        `;

    }

}


/* =========================================================
   EVENTS
========================================================= */

searchInput.addEventListener(
    "input",
    renderBanks
);

currencySelect.addEventListener(
    "change",
    renderBanks
);


refreshBtn.addEventListener(
    "click",
    async () => {

        refreshBtn.style.transform =
            "rotate(360deg)";

        await loadRates();

        setTimeout(() => {

            refreshBtn.style.transform =
                "";

        },400);

    }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
    "serviceWorker" in navigator &&
    location.protocol !== "file:"
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then(reg => {

                    console.log(
                        "SHOHIN SW registered:",
                        reg.scope
                    );

                })
                .catch(error => {

                    console.error(
                        "SW error:",
                        error
                    );

                });

        }
    );

}


/* =========================================================
   START
========================================================= */

loadRates();

</script>

</body>
</html>
