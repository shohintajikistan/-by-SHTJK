*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --orange:#ff7a00;
    --orange2:#ff9d2e;

    --bg:#f5f7fb;
    --card:#ffffff;

    --text:#172033;
    --muted:#758096;

    --green:#12a86b;
    --red:#e53935;
    --blue:#3478e5;

    --border:#e8edf4;

    --shadow:
        0 8px 30px rgba(20,30,50,.07);
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    -webkit-tap-highlight-color:transparent;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    background:
        linear-gradient(
            135deg,
            #ff6800,
            #ff7a00 55%,
            #ff9d2e
        );

    color:white;

    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        28px;

    border-radius:
        0 0 30px 30px;

    box-shadow:
        0 10px 30px
        rgba(255,122,0,.25);
}

.header-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;
}

.logo{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo-icon{

    width:46px;
    height:46px;

    border-radius:15px;

    background:
        rgba(255,255,255,.20);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;

    backdrop-filter:blur(10px);
}

.logo-text{

    font-size:20px;

    font-weight:900;
}

.logo-sub{

    margin-top:2px;

    font-size:11px;

    opacity:.85;
}

.refresh-btn{

    width:45px;
    height:45px;

    border-radius:15px;

    background:
        rgba(255,255,255,.18);

    color:white;

    font-size:24px;

    transition:.25s;
}

.refresh-btn:active{

    transform:scale(.9);
}


/* =========================================================
   TITLE
========================================================= */

.header-title{

    margin-top:25px;
}

.header-title h1{

    font-size:28px;

    line-height:1.1;

    font-weight:900;
}

.header-title p{

    margin-top:8px;

    font-size:14px;

    opacity:.9;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    margin:16px;

    background:white;

    border-radius:17px;

    padding:13px 15px;

    box-shadow:var(--shadow);

    display:flex;

    align-items:center;

    gap:10px;

    font-size:13px;
}

.status-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:var(--green);

    flex:none;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    max-width:1050px;

    margin:auto;

    padding:
        0
        16px
        45px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin:
        23px
        0
        13px;

    font-size:19px;

    font-weight:900;
}


/* =========================================================
   OFFICIAL
========================================================= */

.official-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.currency-card{

    background:var(--card);

    border:
        1px solid
        var(--border);

    border-radius:21px;

    padding:16px;

    box-shadow:var(--shadow);

    position:relative;

    overflow:hidden;
}

.currency-card::after{

    content:"";

    position:absolute;

    width:75px;
    height:75px;

    border-radius:50%;

    background:
        rgba(255,122,0,.06);

    right:-25px;
    top:-25px;
}

.currency-name{

    display:flex;

    align-items:center;

    gap:8px;
}

.flag{

    font-size:25px;
}

.code{

    font-size:16px;

    font-weight:900;
}

.currency-label{

    margin-top:3px;

    color:var(--muted);

    font-size:11px;
}

.currency-value{

    margin-top:13px;

    font-size:24px;

    font-weight:900;
}

.currency-unit{

    margin-top:3px;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

    margin-bottom:14px;
}

.search{

    width:100%;

    height:50px;

    border:
        1px solid
        var(--border);

    background:white;

    border-radius:16px;

    padding:
        0 16px;

    outline:none;

    box-shadow:var(--shadow);

    font-size:14px;
}

.search:focus{

    border-color:
        var(--orange);
}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:14px;
}

.stat{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:16px;

    padding:13px;

    box-shadow:var(--shadow);
}

.stat-value{

    font-size:20px;

    font-weight:900;

    color:var(--orange);
}

.stat-label{

    margin-top:3px;

    font-size:10px;

    color:var(--muted);
}


/* =========================================================
   BANKS
========================================================= */

.bank-list{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.bank-card{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:21px;

    padding:17px;

    box-shadow:var(--shadow);
}

.bank-head{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:12px;
}

.bank-name{

    font-size:16px;

    font-weight:900;

    line-height:1.3;
}

.bank-official{

    margin-top:4px;

    color:var(--muted);

    font-size:11px;

    line-height:1.3;
}

.badge{

    flex:none;

    background:#e8faf3;

    color:var(--green);

    border-radius:20px;

    padding:
        6px 9px;

    font-size:10px;

    font-weight:900;

    white-space:nowrap;
}

.badge.no-data{

    background:#fff0ef;

    color:var(--red);
}


/* =========================================================
   CASH
========================================================= */

.rate-box{

    margin-top:15px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.rate{

    background:#f7f9fc;

    border-radius:15px;

    padding:13px;
}

.rate-label{

    color:var(--muted);

    font-size:11px;

    margin-bottom:5px;
}

.rate-value{

    font-size:22px;

    font-weight:900;
}

.rate-value.buy{

    color:var(--green);
}

.rate-value.sell{

    color:var(--orange);
}

.rate-unit{

    margin-top:3px;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   EXTRA DATA
========================================================= */

.extra-title{

    margin-top:15px;

    margin-bottom:8px;

    font-size:12px;

    font-weight:900;

    color:var(--text);
}

.extra-data{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.extra-item{

    background:#fafbfc;

    border-radius:12px;

    padding:10px;
}

.extra-label{

    color:var(--muted);

    font-size:10px;

    margin-bottom:4px;
}

.extra-value{

    font-size:13px;

    font-weight:800;

/* =========================================================
   BANK DATE
========================================================= */

.bank-date{

    color:var(--muted);

    font-size:11px;

/* =========================================================
   NO DATA
========================================================= */

.no-bank-data{

    color:#9a4b43;

    padding:12px;

    border-radius:13px;

    font-size:12px;

    line-height:1.4;

/* =========================================================
   EMPTY
========================================================= */

.empty{

    text-align:center;

    background:white;

    padding:35px 20px;

    border-radius:20px;

    color:var(--muted);

    box-shadow:var(--shadow);

/* =========================================================
   FOOTER
========================================================= */

.footer{

    font-size:11px;

    line-height:1.6;

.footer strong{

   MOBILE
========================================================= */

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

            repeat(4,1fr);
    }

    .bank-list{

        display:grid;

        grid-template-columns:
            repeat(2,1fr);
    }

}

        name:"Доллар США"
    },

    EUR:{
        flag:"🇪🇺",
        name:"Евро"

        name:"Российский рубль"
    },

    CNY:{
        flag:"🇨🇳",
        name:"Китайский юань"
    }

};


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatRate(value){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(Number(value))
    ){

        return "—";

    }

    return Number(value).toLocaleString(
        "ru-RU",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:4
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){

        return "Дата неизвестна";

    }

    try{

        const date =
            new Date(value);

        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return value;

        }

        return date.toLocaleString(
            "ru-RU",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }
    catch{

        return value;

    }

}

    officialGrid.innerHTML =

        Object.keys(CURRENCIES)

            const value =

            return `

                    <div class="currency-name">

}

                            <div class="extra-item">

                                    Кошелёк
